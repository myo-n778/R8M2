<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCIENCE 2026 Writing Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #08111f;
      --panel: rgba(20, 35, 57, 0.78);
      --line: rgba(148, 163, 184, 0.18);
      --cyan: #22d3ee;
      --lime: #a3e635;
      --amber: #fbbf24;
      --rose: #fb7185;
      --accent: #22d3ee;
      --accent-soft: rgba(34, 211, 238, 0.12);
      --accent-line: rgba(34, 211, 238, 0.34);
    }
    body.theme-lime { --accent: #a3e635; --accent-soft: rgba(163, 230, 53, 0.12); --accent-line: rgba(163, 230, 53, 0.34); }
    body.theme-amber { --accent: #fbbf24; --accent-soft: rgba(251, 191, 36, 0.12); --accent-line: rgba(251, 191, 36, 0.34); }
    body.theme-rose { --accent: #fb7185; --accent-soft: rgba(251, 113, 133, 0.12); --accent-line: rgba(251, 113, 133, 0.34); }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 18%, rgba(34, 211, 238, 0.18), transparent 32rem),
        radial-gradient(circle at 82% 6%, rgba(163, 230, 53, 0.13), transparent 26rem),
        linear-gradient(135deg, #08111f 0%, #111827 54%, #0f172a 100%);
      color: #e5f4ff;
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    body.theme-lime {
      background:
        radial-gradient(circle at 12% 18%, rgba(163, 230, 53, 0.18), transparent 32rem),
        radial-gradient(circle at 82% 6%, rgba(34, 211, 238, 0.10), transparent 26rem),
        linear-gradient(135deg, #0c160f 0%, #111827 54%, #0f172a 100%);
    }
    body.theme-amber {
      background:
        radial-gradient(circle at 12% 18%, rgba(251, 191, 36, 0.18), transparent 32rem),
        radial-gradient(circle at 82% 6%, rgba(34, 211, 238, 0.10), transparent 26rem),
        linear-gradient(135deg, #171206 0%, #111827 54%, #0f172a 100%);
    }
    body.theme-rose {
      background:
        radial-gradient(circle at 12% 18%, rgba(251, 113, 133, 0.18), transparent 32rem),
        radial-gradient(circle at 82% 6%, rgba(34, 211, 238, 0.10), transparent 26rem),
        linear-gradient(135deg, #190b13 0%, #111827 54%, #0f172a 100%);
    }
    .font-tech { font-family: "Orbitron", "Noto Sans JP", sans-serif; }
    .glass {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
    }
    .chip {
      border: 1px solid var(--accent-line);
      background: var(--accent-soft);
      color: #a5f3fc;
    }
    .problem-card {
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.66);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }
    .problem-card:hover, .problem-card.active {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: rgba(8, 47, 73, 0.58);
    }
    textarea {
      resize: vertical;
      min-height: 15rem;
    }
    .eval-badge {
      width: 3.6rem;
      height: 3.6rem;
      border-radius: 1.1rem;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent-soft), rgba(163, 230, 53, 0.12));
      border: 1px solid var(--accent-line);
      color: white;
      font-size: 1.9rem;
      font-weight: 900;
    }
    .input-compact {
      background: rgba(2, 6, 23, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 0.9rem;
      outline: none;
    }
    .input-compact:focus { border-color: var(--accent); }
    .feedback-copy { font-size: 0.98rem; line-height: 1.75; }
    body.font-size-small { --writing-text-scale: 0.92; }
    body.font-size-standard { --writing-text-scale: 1; }
    body.font-size-large { --writing-text-scale: 1.13; }
    body.font-size-xlarge { --writing-text-scale: 1.26; }
    body { --writing-text-scale: 1; }
    .writing-text { font-size: calc(1rem * var(--writing-text-scale)); }
    .writing-prompt { font-size: calc(1.55rem * var(--writing-text-scale)); }
    .feedback-copy { font-size: calc(1.02rem * var(--writing-text-scale)); line-height: 1.78; }
    .problem-card-text { font-size: calc(0.95rem * var(--writing-text-scale)); }
    .example-copy { font-size: calc(1rem * var(--writing-text-scale)); line-height: 1.85; }
    .font-size-control button { color: rgba(248, 250, 252, 0.68); background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); }
    .font-size-control button.active { color: #020617; background: var(--accent); border-color: rgba(255, 255, 255, 0.55); }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body>
  <main class="max-w-[1500px] mx-auto px-4 py-4 md:py-6">
    <header class="grid xl:grid-cols-[auto_1fr] gap-4 mb-4 items-start">
      <div>
        <div class="font-tech text-[10px] tracking-[0.42em] text-cyan-200/80 font-black uppercase">SCIENCE 2026</div>
        <h1 class="text-3xl md:text-5xl font-black tracking-tight mt-1">Writing Feedback</h1>
      </div>
      <div class="glass rounded-[1.4rem] p-3 xl:justify-self-end w-full xl:max-w-[920px]">
        <div class="grid md:grid-cols-[auto_auto_auto_auto] gap-2 items-center justify-end">
          <div id="profile-view" class="hidden items-center gap-2">
            <span class="font-tech text-[10px] text-slate-400 font-black tracking-[0.2em] uppercase">USER</span>
            <button id="active-user-display" class="bg-white/10 text-white text-[10px] px-4 py-2 rounded-full border border-white/20 font-black italic cursor-default">--</button>
            <button id="logout-btn" class="bg-white/10 text-white text-[10px] px-3 py-2 rounded-full border border-white/20 font-black italic cursor-pointer transition-all hover:opacity-80">LOGOUT</button>
          </div>
          <div id="profile-edit" class="flex items-center gap-2">
            <span class="font-tech text-[10px] text-slate-400 font-black tracking-[0.2em] uppercase">USER</span>
            <input id="user-class" class="input-compact px-3 py-2 text-sm w-20" placeholder="クラス">
            <input id="user-number" class="input-compact px-3 py-2 text-sm w-20" placeholder="番号">
            <input id="user-name" class="input-compact px-3 py-2 text-sm w-36" placeholder="名前">
            <button id="save-profile-btn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 rounded-xl px-3 py-2 text-xs font-black uppercase">Save</button>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-tech text-[10px] text-slate-400 font-black tracking-[0.16em] uppercase">Level</span>
            <select id="feedback-level" class="input-compact px-3 py-2 text-sm w-28">
              <option value="中学生">中学生</option>
              <option value="高校生">高校生</option>
              <option value="先生">先生</option>
            </select>
          </div>
          <details class="relative">
            <summary class="chip cursor-pointer rounded-full px-4 py-2 text-xs font-black uppercase"><i class="fa-solid fa-gauge-high"></i> Usage</summary>
            <div id="limit-status" class="absolute right-0 z-20 mt-2 w-72 rounded-xl bg-slate-950 border border-slate-700 p-3 text-xs text-slate-300 shadow-2xl">同期してください。</div>
          </details>
          <div id="font-size-control" class="font-size-control flex gap-0.5">
            <button type="button" data-font-size="small" class="px-2 py-1.5 rounded-md text-[9px] font-black transition-all">小</button>
            <button type="button" data-font-size="standard" class="px-2 py-1.5 rounded-md text-[9px] font-black transition-all">標準</button>
            <button type="button" data-font-size="large" class="px-2 py-1.5 rounded-md text-[9px] font-black transition-all">大</button>
            <button type="button" data-font-size="xlarge" class="px-2 py-1.5 rounded-md text-[9px] font-black transition-all">特大</button>
          </div>
          <div class="flex gap-2 justify-end">
            <a href="./science2.0.html" class="chip rounded-full px-4 py-2 text-xs font-black uppercase"><i class="fa-solid fa-arrow-left"></i> Selection</a>
            <button id="sync-btn" class="chip rounded-full px-4 py-2 text-xs font-black uppercase"><i class="fa-solid fa-rotate"></i> Sync</button>
            <button id="theme-btn" class="chip rounded-full px-4 py-2 text-xs font-black uppercase"><i class="fa-solid fa-palette"></i> Theme</button>
          </div>
        </div>
      </div>
    </header>

    <section class="grid xl:grid-cols-[520px_minmax(0,1fr)_360px] gap-4 items-start">
      <section class="glass rounded-[1.8rem] p-4 md:p-5 min-h-[40rem]">
        <div id="message" class="hidden rounded-2xl p-4 text-sm mb-4"></div>

        <div id="empty-state" class="h-full min-h-[32rem] grid place-items-center text-center text-slate-400">
          <div>
            <i class="fa-solid fa-pen-nib text-4xl text-cyan-300 mb-4"></i>
            <p class="font-bold">右側から記述問題を選んでください。</p>
            <p class="text-xs mt-2">問題が出ない場合は、スプレッドシートの `記述問題` シートを確認してください。</p>
          </div>
        </div>

        <div id="writing-area" class="hidden space-y-5">
          <div class="rounded-[1.4rem] border border-slate-700/60 bg-slate-950/35 p-4">
            <div class="flex flex-wrap gap-2 mb-3">
              <span id="selected-unit" class="chip rounded-full px-3 py-1 text-[10px] font-black"></span>
              <span id="selected-grade" class="chip rounded-full px-3 py-1 text-[10px] font-black"></span>
              <span id="max-chars" class="chip rounded-full px-3 py-1 text-[10px] font-black"></span>
            </div>
            <h2 id="prompt" class="writing-prompt font-black leading-relaxed"></h2>
          </div>

          <div>
            <div>
              <div class="flex justify-between items-center mb-2">
                <label for="answer" class="font-tech text-[10px] font-black uppercase text-slate-300 tracking-[0.18em]">Your Answer</label>
                <span id="char-count" class="text-xs text-slate-400">0 / 300</span>
              </div>
              <textarea id="answer" class="writing-text w-full bg-slate-950/70 border border-slate-700 rounded-2xl p-4 leading-relaxed outline-none focus:border-cyan-400" placeholder="ここに自分の考えを書きます。短くても送れます。"></textarea>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-3">
            <button id="feedback-btn" class="bg-lime-400 hover:bg-lime-300 text-slate-950 rounded-2xl px-5 py-4 text-sm font-black uppercase flex-1">
              <i class="fa-solid fa-comments"></i> フィードバックを見る
            </button>
            <button id="clear-btn" class="bg-white/10 hover:bg-white/15 border border-white/10 text-slate-200 rounded-2xl px-5 py-4 text-sm font-black uppercase">Clear</button>
          </div>

          <div id="peer-example-panel" class="hidden rounded-[1.4rem] border border-white/10 bg-slate-950/35 p-4">
            <button id="toggle-peer-examples-btn" type="button" class="w-full rounded-2xl border border-cyan-300/25 bg-cyan-400/10 hover:bg-cyan-400/15 px-4 py-3 text-sm font-black text-cyan-100 transition-all">
              <i class="fa-solid fa-users"></i> 他の人の解答例を見る
            </button>
            <p class="mt-2 text-xs text-slate-400 leading-relaxed">表現の参考です。名前や番号は表示されません。</p>
            <div id="peer-examples" class="hidden mt-3 space-y-3"></div>
          </div>

        </div>
      </section>

      <section id="feedback-panel" class="glass rounded-[1.8rem] p-4 xl:sticky xl:top-4">
        <div class="flex gap-3 items-start mb-4">
          <div id="evaluation" class="eval-badge">-</div>
          <div>
            <div class="font-tech text-[10px] tracking-[0.25em] text-cyan-200 font-black uppercase">Feedback</div>
            <p id="overall" class="text-slate-100 font-bold mt-2 leading-relaxed feedback-copy"></p>
          </div>
        </div>
        <div class="space-y-3 text-sm">
          <div class="rounded-2xl bg-emerald-400/10 border border-emerald-300/20 p-4"><div class="text-emerald-200 font-black text-xs mb-2">良い点</div><p id="good" class="feedback-copy"></p></div>
          <div class="rounded-2xl bg-amber-400/10 border border-amber-300/20 p-4"><div class="text-amber-200 font-black text-xs mb-2">直すと良い点</div><p id="improve" class="feedback-copy"></p></div>
          <div class="rounded-2xl bg-cyan-400/10 border border-cyan-300/20 p-4"><div class="text-cyan-200 font-black text-xs mb-2">書くときのポイント</div><p id="next" class="feedback-copy"></p></div>
        </div>
        <div id="key-point-box" class="hidden mt-4 rounded-2xl bg-rose-400/10 border border-rose-300/25 p-4">
          <div class="text-rose-200 font-black text-xs mb-2">重要ポイント</div>
          <p id="key-point" class="feedback-copy text-slate-100 font-bold"></p>
        </div>
        <div id="example-controls" class="hidden mt-4">
          <button id="toggle-examples-btn" type="button" class="w-full rounded-2xl border border-white/10 bg-white/10 hover:bg-white/15 px-4 py-3 text-sm font-black text-slate-100 transition-all">
            <i class="fa-solid fa-eye"></i> 解答例を見る
          </button>
          <p class="mt-2 text-xs text-slate-400 leading-relaxed">丸暗記用ではなく、書き方を整えるための一例です。</p>
        </div>
        <div id="answer-examples" class="hidden mt-4 space-y-3">
          <div class="rounded-2xl bg-lime-400/10 border border-lime-300/20 p-4">
            <div class="text-lime-200 font-black text-xs mb-2">添削後の解答例</div>
            <p id="revised-answer" class="example-copy"></p>
          </div>
          <div class="rounded-2xl bg-violet-400/10 border border-violet-300/20 p-4">
            <div class="text-violet-200 font-black text-xs mb-2">模範解答（別の書き方）</div>
            <p id="model-answer" class="example-copy"></p>
          </div>
        </div>
        <div id="extra-notes" class="mt-3 text-sm text-slate-300 space-y-2 leading-relaxed"></div>
        <div id="remember-box" class="hidden mt-4 rounded-2xl bg-white/5 border border-white/10 p-4">
          <div class="text-slate-200 font-black text-xs mb-3">今回覚えること</div>
          <div id="remember-list" class="flex flex-wrap gap-2"></div>
        </div>
      </section>

      <aside class="space-y-4 xl:sticky xl:top-4">
        <section class="glass rounded-[1.8rem] p-4">
          <div class="flex items-center justify-between gap-3 mb-3">
            <h2 class="font-tech text-xs font-black uppercase tracking-[0.18em] text-cyan-200">Session Library</h2>
            <span id="task-count" class="text-[10px] text-slate-400 font-bold">0 tasks</span>
          </div>
          <div id="problem-list" class="space-y-2 max-h-72 overflow-y-auto pr-1"></div>
        </section>
      </aside>
    </section>
  </main>

  <script src="./common/science-shared.js"></script>
  <script>
    const SHARED = window.ScienceShared || {};
    const GAS_URL = SHARED.gasUrl || "https://script.google.com/macros/s/AKfycbzC7-HToEmmWbdaK2D4_J_QaPeRwJUjAPobvBgbB8yM4PBpGXeMgdppUV3UpqbIVbQklw/exec";
    const SPREADSHEET_URL = "https://docs.google.com/spreadsheets/d/1LCGCVjeiTicyclXFTP0EaxxB_RluZJrveWPo1FdLzsk/edit";
    const SPREADSHEET_ID = (SPREADSHEET_URL.match(/\/d\/([^/]+)/) || [])[1] || "";
    const normalizeUserName = SHARED.normalizeUserName || ((name) => name ? name.normalize("NFKC").trim() : "");

    let writingProblems = [];
    let selectedProblem = null;
    let writingConfig = { writingAiEnabled: false, writingMaxChars: 300, writingModel: "gpt-5.4-nano" };
    let usage = {};
    const FEEDBACK_LEVELS = ["中学生", "高校生", "先生"];
    const THEME_SEQUENCE = ["modeA", "modeB", "modeC", "modeE", "modeF", "modeG", "t16", "t31"];
    const THEMES = {
      modeA: { bg: "#0f172a", panel: "rgba(30, 41, 59, 0.85)", accent: "#6366f1", text: "#f8fafc" },
      modeB: { bg: "#064e3b", panel: "rgba(6, 78, 59, 0.8)", accent: "#10b981", text: "#ecfdf5" },
      modeC: { bg: "#450a0a", panel: "rgba(127, 29, 29, 0.7)", accent: "#f43f5e", text: "#fff1f2" },
      modeE: { bg: "#431407", panel: "rgba(124, 45, 18, 0.8)", accent: "#f59e0b", text: "#fff7ed" },
      modeF: { bg: "#083344", panel: "rgba(22, 78, 99, 0.8)", accent: "#00f2ff", text: "#ecfeff" },
      modeG: { bg: "#2e1065", panel: "rgba(76, 29, 149, 0.8)", accent: "#a855f7", text: "#f5f3ff" },
      t16: { bg: "#020617", panel: "rgba(15, 23, 42, 0.85)", accent: "#38bdf8", text: "#f8fafc" },
      t31: { bg: "#fff1f2", panel: "rgba(255, 255, 255, 0.85)", accent: "#fb7185", text: "#881337" }
    };
    const FONT_SIZE_MODES = ["small", "standard", "large", "xlarge"];
    const FONT_SIZE_STORAGE_KEY = "writing_font_size_mode";

    const el = (id) => document.getElementById(id);
    const userId = () => `${el("user-class").value.trim()}-${el("user-number").value.trim()}-${normalizeUserName(el("user-name").value)}`;
    const isProfileReady = () => el("user-class").value.trim() && el("user-number").value.trim() && normalizeUserName(el("user-name").value);

    function updateProfileMode() {
      const ready = isProfileReady();
      el("profile-view").classList.toggle("hidden", !ready);
      el("profile-view").classList.toggle("flex", ready);
      el("profile-edit").classList.toggle("hidden", ready);
      if (ready) {
        el("active-user-display").textContent = `${el("user-class").value.trim()}-${el("user-number").value.trim()} ${normalizeUserName(el("user-name").value)}`;
      }
    }

    function showMessage(text, type = "info") {
      const box = el("message");
      box.className = "rounded-2xl p-4 text-sm";
      box.classList.remove("hidden");
      const styles = {
        info: "bg-cyan-400/10 border border-cyan-300/20 text-cyan-100",
        error: "bg-rose-400/10 border border-rose-300/20 text-rose-100",
        ok: "bg-lime-400/10 border border-lime-300/20 text-lime-100"
      };
      box.className += " " + (styles[type] || styles.info);
      box.textContent = text;
    }

    function saveProfile() {
      const name = normalizeUserName(el("user-name").value);
      localStorage.setItem("ethics_user_class", el("user-class").value.trim());
      localStorage.setItem("ethics_user_number", el("user-number").value.trim());
      localStorage.setItem("ethics_user_name", name);
      el("user-name").value = name;
      updateProfileMode();
      showMessage("ユーザー情報を保存しました。", "ok");
      syncWriting();
    }

    function loadProfile() {
      el("user-class").value = localStorage.getItem("ethics_user_class") || "";
      el("user-number").value = localStorage.getItem("ethics_user_number") || "";
      el("user-name").value = localStorage.getItem("ethics_user_name") || "";
      const savedLevel = localStorage.getItem("writing_feedback_level") || "中学生";
      el("feedback-level").value = FEEDBACK_LEVELS.includes(savedLevel) ? savedLevel : "中学生";
      updateProfileMode();
    }

    function logoutProfile() {
      localStorage.removeItem("ethics_user_class");
      localStorage.removeItem("ethics_user_number");
      localStorage.removeItem("ethics_user_name");
      el("user-class").value = "";
      el("user-number").value = "";
      el("user-name").value = "";
      updateProfileMode();
      showMessage("ユーザー情報を解除しました。", "info");
    }

    function feedbackLevel() {
      const value = el("feedback-level").value;
      return FEEDBACK_LEVELS.includes(value) ? value : "中学生";
    }

    function applyTheme(theme) {
      const safeTheme = THEMES[theme] ? theme : "modeA";
      const t = THEMES[safeTheme];
      document.documentElement.style.setProperty("--bg", t.bg);
      document.documentElement.style.setProperty("--panel", t.panel);
      document.documentElement.style.setProperty("--accent", t.accent);
      document.documentElement.style.setProperty("--accent-soft", `${t.accent}22`);
      document.documentElement.style.setProperty("--accent-line", `${t.accent}66`);
      document.body.style.color = t.text;
      localStorage.setItem("ethics_theme_mode", safeTheme);
      const themeButton = el("theme-btn");
      if (themeButton) themeButton.innerHTML = `<i class="fa-solid fa-palette"></i> ${safeTheme.toUpperCase()}`;
    }

    function cycleTheme() {
      const current = localStorage.getItem("ethics_theme_mode") || "modeA";
      const currentIndex = THEME_SEQUENCE.indexOf(current);
      const next = THEME_SEQUENCE[(currentIndex + 1) % THEME_SEQUENCE.length] || "modeA";
      applyTheme(next);
    }

    function normalizeFontSizeMode(mode) {
      return FONT_SIZE_MODES.includes(mode) ? mode : "standard";
    }

    function applyFontSizeMode(mode) {
      const normalized = normalizeFontSizeMode(mode);
      FONT_SIZE_MODES.forEach((name) => document.body.classList.remove(`font-size-${name}`));
      document.body.classList.add(`font-size-${normalized}`);
      document.querySelectorAll("[data-font-size]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.fontSize === normalized);
      });
      localStorage.setItem(FONT_SIZE_STORAGE_KEY, normalized);
    }

    async function fetchJson(params) {
      const url = `${GAS_URL}?${new URLSearchParams(params).toString()}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data;
    }

    function renderLimits() {
      const daily = usage.dailyRemaining === null || usage.dailyRemaining === undefined ? "無制限" : `${usage.dailyRemaining}回`;
      const monthly = usage.monthlyRemaining === null || usage.monthlyRemaining === undefined ? "無制限" : `${usage.monthlyRemaining}回`;
      const state = writingConfig.writingAiEnabled ? "ON" : "OFF";
      el("limit-status").innerHTML = `AIフィードバック: <b>${state}</b><br>本日の残り: <b>${daily}</b> / 今月全体の残り: <b>${monthly}</b><br>model: <b>${writingConfig.writingModel || "gpt-5.4-nano"}</b>`;
    }

    function renderProblems() {
      const list = el("problem-list");
      list.innerHTML = "";
      const problems = Array.isArray(writingProblems) ? writingProblems : [];
      el("task-count").textContent = `${problems.length} tasks`;
      if (!problems.length) {
        list.innerHTML = `<div class="text-sm text-slate-400 rounded-2xl border border-slate-800 bg-slate-950/40 p-4">表示できる記述問題がありません。</div>`;
        return;
      }
      problems.forEach((problem) => {
        const button = document.createElement("button");
        button.className = "problem-card rounded-2xl p-4 text-left w-full";
        button.dataset.problemId = problem.problemId;
        const bestText = problem.bestEvaluation ? `${escapeHtml(problem.bestEvaluation)}${problem.bestEvaluationDate ? ` / ${escapeHtml(problem.bestEvaluationDate)}` : ""}` : "未挑戦";
        button.innerHTML = `
          <div class="flex justify-between gap-3 mb-2">
            <span class="text-[10px] text-cyan-200 font-black">${problem.unit || "単元未設定"}</span>
          </div>
          <div class="flex items-start gap-2">
            <i class="fa-solid fa-chevron-right text-[10px] text-slate-500 mt-1"></i>
            <div class="problem-card-text font-bold leading-relaxed">${escapeHtml(problem.prompt)}</div>
          </div>
          <div class="mt-3 text-[11px] text-slate-400">${bestText}</div>
        `;
        button.addEventListener("click", () => selectProblem(problem.problemId));
        list.appendChild(button);
      });
    }

    function selectProblem(problemId) {
      selectedProblem = writingProblems.find((p) => p.problemId === problemId) || null;
      if (!selectedProblem) return;
      document.querySelectorAll(".problem-card").forEach((card) => card.classList.toggle("active", card.dataset.problemId === problemId));
      el("empty-state").classList.add("hidden");
      el("writing-area").classList.remove("hidden");
      el("message").classList.add("hidden");
      el("selected-unit").textContent = selectedProblem.unit || "単元未設定";
      el("selected-grade").textContent = selectedProblem.grade || "学年未設定";
      el("max-chars").textContent = `${selectedProblem.maxChars || writingConfig.writingMaxChars}字まで`;
      el("prompt").textContent = selectedProblem.prompt;
      renderPeerExamples([]);
      updateCharCount();
    }

    function updateCharCount() {
      const max = selectedProblem ? selectedProblem.maxChars : writingConfig.writingMaxChars;
      const count = el("answer").value.length;
      el("char-count").textContent = `${count} / ${max}`;
      el("char-count").className = count > max ? "text-xs text-rose-300 font-bold" : "text-xs text-slate-400";
    }

    async function syncWriting() {
      try {
        const params = { action: "syncWriting", id: SPREADSHEET_ID };
        if (isProfileReady()) params.userId = userId();
        const data = await fetchJson(params);
        if (!Array.isArray(data.problems)) {
          throw new Error("GASが記述問題用の syncWriting に対応していない可能性があります。Apps Scriptに最新のGAS.txtを貼り替えて再デプロイしてください。");
        }
        writingProblems = data.problems;
        writingConfig = { ...writingConfig, ...(data.config || {}) };
        usage = data.usage || {};
        renderLimits();
        renderProblems();
      } catch (err) {
        showMessage(`同期に失敗しました: ${err.message}`, "error");
      }
    }

    async function requestFeedback() {
      if (!selectedProblem) return showMessage("記述問題を選んでください。", "error");
      if (!isProfileReady()) return showMessage("クラス・番号・名前を保存してください。", "error");
      const answer = el("answer").value.trim();
      if (!answer) return showMessage("回答が空欄です。", "error");
      if (answer.length > selectedProblem.maxChars) return showMessage(`回答が上限の${selectedProblem.maxChars}字を超えています。`, "error");
      if (!writingConfig.writingAiEnabled) return showMessage("現在、記述AIフィードバックはOFFです。", "error");

      const button = el("feedback-btn");
      button.disabled = true;
      button.classList.add("opacity-60");
      showMessage("フィードバックを作成しています...", "info");
      try {
        const data = await fetchJson({
          action: "gradeWriting",
          id: SPREADSHEET_ID,
          userId: userId(),
          userName: normalizeUserName(el("user-name").value),
          userClass: el("user-class").value.trim(),
          userNumber: el("user-number").value.trim(),
          problemId: selectedProblem.problemId,
          feedbackLevel: feedbackLevel(),
          answer
        });
        renderFeedback(data.feedback || {});
        renderPeerExamples(data.peerExamples || []);
        showMessage("フィードバックを記録しました。", "ok");
        await syncWriting();
      } catch (err) {
        showMessage(err.message, "error");
      } finally {
        button.disabled = false;
        button.classList.remove("opacity-60");
      }
    }

    function renderFeedback(feedback) {
      el("feedback-panel").classList.remove("hidden");
      el("evaluation").textContent = feedback.evaluation || "-";
      el("overall").textContent = feedback.overall || "コメントはありません。";
      el("good").textContent = feedback.good || "--";
      el("improve").textContent = feedback.improve || "--";
      el("next").textContent = feedback.next || "--";
      el("key-point").textContent = feedback.keyPoint || "";
      el("key-point-box").classList.toggle("hidden", !feedback.keyPoint);
      const hasExamples = !!(feedback.revisedAnswer || feedback.modelAnswer);
      el("revised-answer").textContent = feedback.revisedAnswer || "--";
      el("model-answer").textContent = feedback.modelAnswer || "--";
      el("example-controls").classList.toggle("hidden", !hasExamples);
      el("answer-examples").classList.add("hidden");
      el("toggle-examples-btn").innerHTML = `<i class="fa-solid fa-eye"></i> 解答例を見る`;
      const notes = [];
      const scienceNotes = [feedback.factCheck, feedback.misconception, feedback.variationNote].filter(Boolean);
      if (scienceNotes.length) notes.push(`<div><b class="text-cyan-200">理科の補足:</b> ${scienceNotes.map(escapeHtml).join(" ")}</div>`);
      el("extra-notes").innerHTML = notes.join("");
      const rememberItems = String(feedback.remember || "")
        .split(/[\/／\n]/)
        .map((item) => item.replace(/^・/, "").trim())
        .filter(Boolean)
        .slice(0, 3);
      el("remember-box").classList.toggle("hidden", rememberItems.length === 0);
      el("remember-list").innerHTML = rememberItems.map((item) => `<span class="rounded-full bg-white/10 border border-white/10 px-3 py-2 text-xs font-bold text-slate-100">${escapeHtml(item)}</span>`).join("");
    }

    function renderPeerExamples(examples) {
      const list = Array.isArray(examples) ? examples : [];
      const panel = el("peer-example-panel");
      const body = el("peer-examples");
      panel.classList.toggle("hidden", list.length === 0);
      body.classList.add("hidden");
      el("toggle-peer-examples-btn").innerHTML = `<i class="fa-solid fa-users"></i> 他の人の解答例を見る`;
      if (!list.length) {
        body.innerHTML = "";
        return;
      }
      body.innerHTML = list.map((item, index) => `
        <div class="rounded-2xl border border-slate-700/70 bg-slate-950/55 p-4">
          <div class="mb-2 text-[10px] font-black tracking-[0.18em] text-cyan-200 uppercase">Example ${index + 1}</div>
          <p class="example-copy text-slate-100">${escapeHtml(item.answer)}</p>
        </div>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    el("save-profile-btn").addEventListener("click", saveProfile);
    el("logout-btn").addEventListener("click", logoutProfile);
    el("sync-btn").addEventListener("click", syncWriting);
    el("theme-btn").addEventListener("click", cycleTheme);
    el("feedback-btn").addEventListener("click", requestFeedback);
    el("toggle-examples-btn").addEventListener("click", () => {
      const examples = el("answer-examples");
      const willShow = examples.classList.contains("hidden");
      examples.classList.toggle("hidden", !willShow);
      el("toggle-examples-btn").innerHTML = willShow
        ? `<i class="fa-solid fa-eye-slash"></i> 解答例を隠す`
        : `<i class="fa-solid fa-eye"></i> 解答例を見る`;
    });
    el("toggle-peer-examples-btn").addEventListener("click", () => {
      const examples = el("peer-examples");
      const willShow = examples.classList.contains("hidden");
      examples.classList.toggle("hidden", !willShow);
      el("toggle-peer-examples-btn").innerHTML = willShow
        ? `<i class="fa-solid fa-users-slash"></i> 他の人の解答例を隠す`
        : `<i class="fa-solid fa-users"></i> 他の人の解答例を見る`;
    });
    el("feedback-level").addEventListener("change", () => localStorage.setItem("writing_feedback_level", feedbackLevel()));
    el("clear-btn").addEventListener("click", () => {
      el("answer").value = "";
      el("message").classList.add("hidden");
      renderPeerExamples([]);
      updateCharCount();
    });
    el("answer").addEventListener("input", updateCharCount);
    document.querySelectorAll("[data-font-size]").forEach((btn) => {
      btn.addEventListener("click", () => applyFontSizeMode(btn.dataset.fontSize));
    });

    renderFeedback({
      evaluation: "-",
      overall: "フィードバックはここに表示されます。回答を書いてから送信してください。",
      good: "--",
      improve: "--",
      next: "--"
    });
    loadProfile();
    applyFontSizeMode(localStorage.getItem(FONT_SIZE_STORAGE_KEY) || "standard");
    applyTheme(localStorage.getItem("ethics_theme_mode") || "modeA");
    syncWriting();
  </script>
</body>
</html>
